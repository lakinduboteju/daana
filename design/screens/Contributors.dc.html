<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<title>දායකයන්</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B04E0A}a:hover{color:#8A3D08}
</style>
</helmet>
<div style="width: 390px; height: 980px; position: relative; overflow: hidden; background: #FAF7F2; color: #2A2420; font-family: 'Noto Sans Sinhala', system-ui, sans-serif; line-height: 1.5">
  <header style="padding: 20px 16px 8px">
    <h1 style="margin: 0 0 10px; font-size: 26px; font-weight: 700">දායකයන්</h1>
    <div style="position: relative">
      <label for="cq" style="position: absolute; width: 1px; height: 1px; overflow: hidden">දායකයන් සොයන්න</label>
      <input id="cq" type="search" placeholder="නම හෝ දුරකථන අංකය" style="width: 100%; box-sizing: border-box; height: 50px; padding: 0 14px 0 44px; border: 1px solid #CFC6BA; border-radius: 12px; font-size: 16px; font-family: inherit; background: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B625A" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    </div>
  </header>

  <div style="padding: 8px 16px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; background: #FFFFFF; border: 1px solid #E7E1D8; border-radius: 14px">
        <span style="width: 44px; height: 44px; border-radius: 22px; background: #F3EEE7; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #57504A; flex-shrink: 0">{{p.initial}}</span>
        <a href="ContributorDetail.dc.html" style="flex: 1; min-width: 0; text-decoration: none; color: inherit">
          <span style="display: block; font-size: 16px; font-weight: 600">{{p.name}}</span>
          <span style="display: block; font-size: 13px; color: #6B625A">ඉදිරි අයිතම {{p.count}}</span>
          <sc-if value="{{p.pending}}" hint-placeholder-val="{{ false }}">
            <span style="display: inline-block; margin-top: 2px; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: #FDF0D5; color: #7A4A00">◔ තහවුරු නොවූ {{p.pending}}</span>
          </sc-if>
        </a>
        <a href="tel:0771234567" aria-label="{{p.name}} අමතන්න" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCD4C9; display: flex; align-items: center; justify-content: center; color: #2A2420; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
        </a>
        <a href="#" aria-label="{{p.name}}ට WhatsApp පණිවිඩයක්" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #DCD4C9; display: flex; align-items: center; justify-content: center; color: #2A2420; flex-shrink: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"></path></svg>
        </a>
      </div>
    </sc-for>
  </div>

  <a href="#" style="position: absolute; right: 16px; bottom: 92px; height: 56px; padding: 0 22px 0 18px; border-radius: 28px; background: #B04E0A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; box-shadow: 0 6px 16px rgba(120,60,10,0.28)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    නව දායකයා
  </a>

  <nav aria-label="ප්‍රධාන" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #FFFFFF; border-top: 1px solid #E7E1D8; display: flex">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6B625A; font-size: 13px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>දාන</a>
    <a href="Search.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6B625A; font-size: 13px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>සොයන්න</a>
    <a href="Contributors.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #B04E0A; font-size: 13px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"></path></svg>දායකයන්</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (name, count, pending) => ({ name: name, initial: name.charAt(0), count: count, pending: pending });
    return {
      people: [
        p('අනුලා විජේසේකර', 1, 0),
        p('කමලා රත්නායක', 2, 0),
        p('ගුණපාල', 1, 0),
        p('දිල්රුක්ෂි', 1, 1),
        p('නිමල් සිල්වා', 1, 0),
        p('රුවන් කුමාර', 1, 1),
        p('සුනිල් ජයසිංහ ගමගේ (ගාල්ල පාර)', 3, 1)
      ]
    };
  }
}
</script>
</body>
</html>
