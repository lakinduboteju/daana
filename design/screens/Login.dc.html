<x-dc>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B04E0A}a:hover{color:#8A3D08}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 72px 24px 32px; background: #FAF7F2; color: #2A2420; font-family: 'Noto Sans Sinhala', system-ui, sans-serif; line-height: 1.5; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
    <div style="width: 72px; height: 72px; border-radius: 36px; background: #FBEADB; color: #B04E0A; display: flex; align-items: center; justify-content: center">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0z"></path><path d="M9 8c0-2 1.5-3 3-4 1.5 1 3 2 3 4"></path><path d="M8 21h8"></path></svg>
    </div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">දාන සංවිධායක</h1>
    <p style="margin: 0; font-size: 16px; color: #6B625A">දානයේ මෙනුව, දායකයන් සහ වියදම් එකම තැනක</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 18px; margin-top: 8px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="username" style="font-size: 15px; font-weight: 600">නම</label>
      <input id="username" type="text" autocomplete="username" autocapitalize="none" placeholder="username" style="height: 52px; padding: 0 14px; border: 1px solid #CFC6BA; border-radius: 12px; background: #FFFFFF; font-size: 17px; font-family: inherit; color: #2A2420">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw" style="font-size: 15px; font-weight: 600">මුරපදය</label>
      <input id="pw" type="password" autocomplete="current-password" style="height: 52px; padding: 0 14px; border: 1px solid #CFC6BA; border-radius: 12px; background: #FFFFFF; font-size: 17px; font-family: inherit">
      <a href="#" style="align-self: flex-end; font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 0">මුරපදය අමතකද?</a>
    </div>
    <a href="Main.dc.html" style="height: 54px; border-radius: 14px; background: #B04E0A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">ඇතුළු වන්න</a>
  </form>

  <div style="margin-top: auto; padding: 14px 16px; border-radius: 12px; background: #F3EEE7; font-size: 14px; color: #57504A; text-align: center">දායකයන්ට ගිණුමක් අවශ්‍ය නැත. සංවිධායක පමණක් ඇතුළු වේ.</div>
</div>
</x-dc>
