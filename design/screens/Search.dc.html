<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<title>සොයන්න</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B04E0A}a:hover{color:#8A3D08}
</style>
</helmet>
<div style="width: 390px; height: 1060px; position: relative; overflow: hidden; background: #FAF7F2; color: #2A2420; font-family: 'Noto Sans Sinhala', system-ui, sans-serif; line-height: 1.5">
  <header style="padding: 20px 16px 8px">
    <h1 style="margin: 0 0 10px; font-size: 26px; font-weight: 700">සොයන්න</h1>
    <div style="position: relative">
      <label for="gq" style="position: absolute; width: 1px; height: 1px; overflow: hidden">සියලු දාන තුළ සොයන්න</label>
      <input id="gq" type="search" placeholder="ආහාරය, දායකයා, අසපුව…" style="width: 100%; box-sizing: border-box; height: 50px; padding: 0 14px 0 44px; border: 1px solid #CFC6BA; border-radius: 12px; font-size: 16px; font-family: inherit; background: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B625A" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    </div>
  </header>

  <div style="padding: 8px 16px 0">
    <div style="font-size: 13px; font-weight: 600; color: #6B625A; margin-bottom: 6px">ඉක්මන් පෙරහන්</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{presets}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 40px; padding: 0 14px; border-radius: 20px; font-family: inherit; font-size: 14px; font-weight: 600; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1px dashed #B5AA9D; background: transparent; font-family: inherit; font-size: 14px; color: #3F3833">දින පරාසය: ඉදිරි දාන ▾</button>
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1px dashed #B5AA9D; background: transparent; font-family: inherit; font-size: 14px; color: #3F3833">අසපුව ▾</button>
      <button type="button" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1px dashed #B5AA9D; background: transparent; font-family: inherit; font-size: 14px; color: #3F3833">දායකයා ▾</button>
    </div>
  </div>

  <div style="padding: 16px 16px 0; display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-size: 15px; font-weight: 700">ප්‍රතිඵල {{count}}</span>
    <button type="button" onClick="{{clear}}" style="height: 36px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #B04E0A">Clear</button>
  </div>

  <div style="padding: 4px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="background: #FFFFFF; border: 1px solid #E7E1D8; border-radius: 14px; overflow: hidden">
        <a href="EventDetail.dc.html" style="display: block; padding: 10px 14px; background: #F6F1EA; text-decoration: none; color: inherit">
          <span style="display: block; font-size: 14px; font-weight: 700">{{g.date}} · {{g.meal}}</span>
          <span style="display: block; font-size: 13px; color: #6B625A">{{g.name}}</span>
        </a>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
          <a href="ItemDetail.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid #F0EBE4; text-decoration: none; color: inherit">
            <span style="flex: 1; min-width: 0">
              <span style="display: block; font-size: 16px; font-weight: 600">{{it.name}}</span>
              <span style="display: block; font-size: 14px; color: #6B625A">{{it.sub}}</span>
            </span>
            <span style="flex-shrink: 0; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: {{it.bg}}; color: {{it.fg}}; border: 1px solid {{it.bd}}">{{it.sym}} {{it.label}}</span>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </div>

  <nav aria-label="ප්‍රධාන" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: #FFFFFF; border-top: 1px solid #E7E1D8; display: flex">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6B625A; font-size: 13px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>දාන</a>
    <a href="Search.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #B04E0A; font-size: 13px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>සොයන්න</a>
    <a href="Contributors.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #6B625A; font-size: 13px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"></path></svg>දායකයන්</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { preset: 'pending' }; }
  renderVals() {
    const S = {
      none:    { label: 'පවරා නැත', sym: '○', bg: '#F1EEEA', fg: '#57504A', bd: '#B5AA9D' },
      pending: { label: 'තහවුරු කර නැත', sym: '◔', bg: '#FDF0D5', fg: '#7A4A00', bd: '#EBC27A' },
      partial: { label: 'අර්ධ වශයෙන්', sym: '◑', bg: '#FDF0D5', fg: '#7A4A00', bd: '#EBC27A' },
      ok:      { label: 'තහවුරුයි', sym: '✓', bg: '#E2F0E6', fg: '#1C5E33', bd: '#A9D3B5' }
    };
    const ev1 = { date: 'නොවැ. 08', meal: 'දහවල් දානය', name: 'බොතේජු පවුල · මාලබේ අසපුව' };
    const ev2 = { date: 'නොවැ. 21', meal: 'දහවල් දානය', name: 'දහම් පාසල් ගුරු මණ්ඩලය · මාලබේ අසපුව' };
    const rows = [
      [ev1, 'සුදු බත්', 'partial', 'සුනිල් ජයසිංහ · කි.ග්‍රෑ. 1 තහවුරු නැත'],
      [ev1, 'අල තෙම්පරාදුව', 'pending', 'රුවන් කුමාර'],
      [ev1, 'වම්බටු මෝජු', 'pending', 'දිල්රුක්ෂි · ප්‍රමාණය නැත'],
      [ev1, 'බෝංචි', 'none', 'දායකයෙකු නැත'],
      [ev1, 'අන්නාසි', 'none', 'දායකයෙකු නැත'],
      [ev1, 'වතුර බෝතල්', 'ok', 'සුනිල් ජයසිංහ · 40'],
      [ev2, 'කිරිබත්', 'ok', 'සුනිල් ජයසිංහ · කි.ග්‍රෑ. 4']
    ];
    const p = this.state.preset;
    const keep = (r) => p === 'pending' ? (r[2] === 'pending' || r[2] === 'partial') : p === 'none' ? r[2] === 'none' : p === 'sunil' ? r[3].indexOf('සුනිල්') === 0 : true;
    const hits = rows.filter(keep);
    const groups = [];
    hits.forEach((r) => {
      let g = groups.filter((x) => x.ev === r[0])[0];
      if (!g) { g = { ev: r[0], date: r[0].date, meal: r[0].meal, name: r[0].name, items: [] }; groups.push(g); }
      const s = S[r[2]];
      g.items.push({ name: r[1], sub: r[3], label: s.label, sym: s.sym, bg: s.bg, fg: s.fg, bd: s.bd });
    });
    const preset = (k, label) => { const on = p === k; return { label: label, on: on ? 'true' : 'false', bg: on ? '#2A2420' : '#FFFFFF', fg: on ? '#FFFFFF' : '#3F3833', bd: on ? '#2A2420' : '#DCD4C9', pick: () => this.setState({ preset: on ? 'all' : k }) }; };
    return {
      presets: [preset('pending', 'තහවුරු නොවූ'), preset('none', 'පවරා නැති'), preset('sunil', 'සුනිල්ගේ අයිතම')],
      groups: groups, count: hits.length,
      clear: () => this.setState({ preset: 'all' })
    };
  }
}
</script>
</body>
</html>
