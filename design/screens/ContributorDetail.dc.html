<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<title>සුනිල් ජයසිංහ — දායකයා</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B04E0A}a:hover{color:#8A3D08}
</style>
</helmet>
<div style="width: 390px; height: 1060px; position: relative; overflow: hidden; background: #FAF7F2; color: #2A2420; font-family: 'Noto Sans Sinhala', system-ui, sans-serif; line-height: 1.5">
  <header style="height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px; background: #FFFFFF">
    <a href="Contributors.dc.html" aria-label="දායකයන් වෙත ආපසු" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2A2420">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <span style="flex: 1"></span>
    <button aria-label="දායකයා සංස්කරණය" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3F3833; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
    </button>
  </header>

  <section style="background: #FFFFFF; padding: 0 16px 16px; border-bottom: 1px solid #E7E1D8">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 60px; height: 60px; border-radius: 30px; background: #FBEADB; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; color: #8A3D08">සු</span>
      <div>
        <h1 style="margin: 0; font-size: 21px; font-weight: 700; line-height: 1.3">සුනිල් ජයසිංහ</h1>
        <div style="font-size: 15px; color: #6B625A">077 123 4567</div>
      </div>
    </div>
    <p style="margin: 10px 0 0; font-size: 14px; color: #3F3833; padding: 8px 12px; background: #F6F1EA; border-radius: 10px">සටහන: සෙනසුරාදා උදේට කතා කරන්න. වාහනයක් ඇත.</p>
    <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <a href="tel:0771234567" style="height: 52px; border-radius: 12px; border: 1px solid #DCD4C9; text-decoration: none; color: #2A2420; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>අමතන්න</a>
      <a href="#" style="height: 52px; border-radius: 12px; border: 1px solid #DCD4C9; text-decoration: none; color: #2A2420; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"></path></svg>WhatsApp</a>
      <a href="#" style="height: 52px; border-radius: 12px; border: 1px solid #DCD4C9; text-decoration: none; color: #2A2420; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path></svg>ලැයිස්තුව යවන්න</a>
    </div>
  </section>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 8px">
      <span style="flex: 1; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E7E1D8; font-size: 13px; color: #6B625A">ඉදිරි අයිතම<b style="display: block; font-size: 20px; color: #2A2420">3</b></span>
      <span style="flex: 1; padding: 10px 12px; border-radius: 12px; background: #FDF0D5; border: 1px solid #EBC27A; font-size: 13px; color: #7A4A00">තහවුරු නොවූ<b style="display: block; font-size: 20px">{{pendingCount}}</b></span>
      <span style="flex: 1; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E7E1D8; font-size: 13px; color: #6B625A">ලබා දුන් මුදල්<b style="display: block; font-size: 20px; color: #2A2420">රු. 2,500</b></span>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="background: #FFFFFF; border: 1px solid #E7E1D8; border-radius: 14px; overflow: hidden">
        <a href="EventDetail.dc.html" style="display: block; padding: 10px 14px; background: #F6F1EA; text-decoration: none; color: inherit">
          <span style="display: block; font-size: 14px; font-weight: 700">{{g.title}}</span>
          <span style="display: block; font-size: 13px; color: #6B625A">{{g.sub}}</span>
        </a>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid #F0EBE4">
            <a href="ItemDetail.dc.html" style="flex: 1; min-width: 0; text-decoration: none; color: inherit">
              <span style="display: block; font-size: 16px; font-weight: 600">{{it.name}}</span>
              <span style="display: block; font-size: 14px; color: #6B625A">{{it.qty}}</span>
            </a>
            <sc-if value="{{it.canConfirm}}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{it.confirm}}" style="flex-shrink: 0; height: 40px; padding: 0 12px; border-radius: 20px; border: 1.5px solid #2E7D4A; background: #FFFFFF; color: #1C5E33; font-family: inherit; font-size: 13px; font-weight: 700">✓ එකඟ වුණා</button>
            </sc-if>
            <span style="flex-shrink: 0; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: {{it.bg}}; color: {{it.fg}}; border: 1px solid {{it.bd}}">{{it.sym}} {{it.label}}</span>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { rice: 'pending' }; }
  renderVals() {
    const S = {
      pending: { label: 'තහවුරු කර නැත', sym: '◔', bg: '#FDF0D5', fg: '#7A4A00', bd: '#EBC27A' },
      ok:      { label: 'තහවුරුයි', sym: '✓', bg: '#E2F0E6', fg: '#1C5E33', bd: '#A9D3B5' },
      recv:    { label: 'ලැබී ඇත', sym: '✓✓', bg: '#E3ECF8', fg: '#1E4A85', bd: '#AFC6E6' }
    };
    const it = (name, qty, st, confirm) => Object.assign({ name: name, qty: qty, canConfirm: st === 'pending' && !!confirm, confirm: confirm }, S[st]);
    const rice = this.state.rice;
    return {
      pendingCount: rice === 'pending' ? 1 : 0,
      groups: [
        { title: 'නොවැ. 08 · දහවල් දානය', sub: 'බොතේජු පවුල · මාලබේ අසපුව', items: [
          it('සුදු බත්', 'කි.ග්‍රෑ. 1 (කමලා සමඟ බෙදාගෙන)', rice, () => this.setState({ rice: 'ok' })),
          it('වතුර බෝතල්', 'බෝතල් 40', 'ok')
        ] },
        { title: 'නොවැ. 21 · දහවල් දානය', sub: 'දහම් පාසල් ගුරු මණ්ඩලය · මාලබේ අසපුව', items: [
          it('කිරිබත්', 'කි.ග්‍රෑ. 4', 'ok')
        ] },
        { title: 'පසුගිය · ඔක්. 12', sub: 'ජයසිංහ පවුල · මාලබේ අසපුව', items: [
          it('කිරිබත්', 'කි.ග්‍රෑ. 3', 'recv')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
